plugins {
    id 'com.android.application'
}

android {
    namespace 'com.escriturametrica.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.escriturametrica.pro'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '4.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
